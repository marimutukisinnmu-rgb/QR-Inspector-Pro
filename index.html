<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>QR Inspector Pro</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#141c2d;--line:#293751;--accent:#55f5b6;--text:#edf4ff;--muted:#9aabc5}
*{box-sizing:border-box}body{margin:0;padding:20px 12px;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}main{max-width:1050px;margin:auto}h1{font-size:28px;margin:0}h1 span{color:var(--accent)}h2{font-size:17px;margin-top:0}p{color:var(--muted);line-height:1.6}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}button,.file-button{background:var(--accent);color:#07140f;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;display:inline-block}.secondary{background:#293751;color:white}button:disabled{opacity:.45;cursor:not-allowed}input[type=file]{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#drop{border:2px dashed #536985;border-radius:12px;padding:32px 12px;text-align:center;color:var(--muted);transition:.15s}#drop.over{border-color:var(--accent);background:#18332c}#preview{max-width:100%;max-height:350px;object-fit:contain;display:none;margin:14px auto 0}#status{padding:11px;background:#0a1221;border-radius:8px;margin-top:12px;overflow-wrap:anywhere}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#080c15;border:1px solid var(--line);padding:12px;border-radius:8px;min-height:65px}textarea{width:100%;min-height:95px;resize:vertical;background:#080c15;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px monospace}.table-wrap{overflow:auto;max-height:450px}table{border-collapse:collapse;width:100%;font:12px ui-monospace,Consolas,monospace;white-space:pre}td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}th{position:sticky;top:0;background:#202c42}.hex{color:var(--accent)}.ascii{color:#dce7ff}.tag{display:inline-block;padding:4px 8px;background:#203a34;color:var(--accent);border-radius:6px;margin:3px}small{color:var(--muted)}video{width:100%;max-height:300px} 
</style>
</head>
<body>
<main>
<h1>QR <span>Inspector Pro</span></h1>
<p>QR画像を読み取り、デコード結果・バイト列・16進ダンプを解析する。</p>
<section class="panel">
<h2>入力</h2>
<div id="drop" tabindex="0"><strong>ここにQR画像をドラッグ＆ドロップ</strong><p>画像をクリップボードから貼り付けてもOK！</p><label class="file-button" for="file">画像を選択</label><input id="file" type="file" accept="image/*"></div>
<img id="preview" alt="入力画像">
<div class="actions"><button id="camera">カメラ起動</button><button id="stop" class="secondary" disabled>カメラ停止</button></div>
<video id="video" autoplay playsinline muted hidden></video><div id="status" role="status">画像を入力してください。</div>
</section>
<section class="panel"><h2>解析結果</h2><div id="result">未解析</div><p id="meta">データ：なし</p><div id="tags"></div><div class="actions"><button id="copy" class="secondary">テキストをコピー</button><button id="download" class="secondary">バイナリ保存</button><button id="clear" class="secondary">クリア</button></div></section>
<section class="panel"><h2>バイナリエディタ</h2><p>Offset / Hex / ASCII。1行16バイトで表示。</p><div class="actions"><button id="viewHex">HEX表示</button><button id="viewText" class="secondary">テキスト表示</button></div><div id="binary" class="table-wrap"></div><h3>バイナリデータを直接入力</h3><textarea id="hexInput" placeholder="例: 48 65 6C 6C 6F 00 FF"></textarea><div class="actions"><button id="applyHex">HEXを解析</button></div></section>
<section class="panel"><h2>テキスト入力・貼り付け</h2><textarea id="textInput" placeholder="QRコードから取得したテキストを貼り付け"></textarea><div class="actions"><button id="applyText">テキストを解析</button></div><small>テキスト貼り付け時はUTF-8に変換して表示します。QR画像そのもののデコードとは異なります。</small></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const $=id=>document.getElementById(id),drop=$("drop"),preview=$("preview"),video=$("video"),canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});
let bytes=new Uint8Array(),resultText="",mode="hex",stream=null,scanning=false,busy=false,lastScan=0,lastScanned="";
function status(s){$("status").textContent=s}
function ascii(data){return Array.from(data,b=>b>=32&&b<=126?String.fromCharCode(b):".").join("")}
function renderBinary(){
 if(!bytes.length){$("binary").textContent="データなし";return}
 if(mode==="text"){$("binary").textContent=new TextDecoder().decode(bytes);return}
 const table=document.createElement("table"),thead=document.createElement("thead"),head=document.createElement("tr");
 ["Offset","Hexadecimal","ASCII"].forEach(s=>{const th=document.createElement("th");th.textContent=s;head.appendChild(th)});thead.appendChild(head);table.appendChild(thead);
 const tbody=document.createElement("tbody"),totalRows=Math.ceil(bytes.length/16),rows=Math.min(totalRows,5000);
 for(let row=0;row<rows;row++){const start=row*16,part=bytes.subarray(start,start+16),tr=document.createElement("tr"),offset=document.createElement("td"),hex=document.createElement("td"),txt=document.createElement("td");
 offset.textContent=start.toString(16).toUpperCase().padStart(8,"0");hex.className="hex";hex.textContent=Array.from(part,b=>b.toString(16).toUpperCase().padStart(2,"0")).join(" ");txt.className="ascii";txt.textContent=ascii(part);tr.append(offset,hex,txt);tbody.appendChild(tr)}
 table.appendChild(tbody);$("binary").replaceChildren(table);
 if(totalRows>rows){const note=document.createElement("p");note.textContent="表示は先頭"+rows+"行まで。全データ: "+bytes.length+" bytes";$("binary").appendChild(note)}
}
function setBytes(data,text,kind){
 bytes=new Uint8Array(data);resultText=text;$("result").textContent=text||"(空データ)";$("meta").textContent="データ種別: "+kind+" / サイズ: "+bytes.length+" bytes";$("tags").replaceChildren();
 [kind,bytes.length+" bytes"].forEach(t=>{const s=document.createElement("span");s.className="tag";s.textContent=t;$("tags").appendChild(s)});
 $("hexInput").value=Array.from(bytes,b=>b.toString(16).toUpperCase().padStart(2,"0")).join(" ");mode="hex";renderBinary()
}
function classify(data){if(/^https?:\/\//i.test(data))return"URL";if(/^data:image\//i.test(data))return"画像Data URL";if(/^[\x20-\x7e\r\n\t]*$/.test(data))return"テキスト";return"バイナリまたは非ASCIIデータ"}
function decodeImage(source){
 if(typeof jsQR!=="function")throw Error("QRライブラリを読み込めません。ネット接続を確認してください。");
 const w=source.videoWidth||source.naturalWidth||source.width,h=source.videoHeight||source.naturalHeight||source.height;if(!w||!h)return null;
 const scale=Math.min(1,1600/Math.max(w,h));canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);ctx.drawImage(source,0,0,canvas.width,canvas.height);
 const image=ctx.getImageData(0,0,canvas.width,canvas.height);return jsQR(image.data,image.width,image.height,{inversionAttempts:"attemptBoth"})
}
function processQR(code){
 const raw=code.binaryData?new Uint8Array(code.binaryData):new TextEncoder().encode(code.data);
 setBytes(raw,code.data,classify(code.data));status("QR認識成功！ "+raw.length+" bytes / Version "+code.version)
}
async function loadImage(file){
 if(!file||!file.type.startsWith("image/")){status("画像ファイルを指定してください。");return}
 stopCamera();const url=URL.createObjectURL(file),image=new Image();preview.src=url;preview.style.display="block";status("画像を解析しています...");
 image.onload=()=>{try{const code=decodeImage(image);if(code)processQR(code);else status("QRコードが見つかりませんでした。")}catch(e){status("解析エラー: "+e.message)}finally{URL.revokeObjectURL(url)}};
 image.onerror=()=>{URL.revokeObjectURL(url);status("画像を開けませんでした。")};image.src=url
}
$("file").addEventListener("change",e=>loadImage(e.target.files[0]));
drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over")});drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");const f=Array.from(e.dataTransfer.files).find(f=>f.type.startsWith("image/"));if(f)loadImage(f);else status("画像ファイルをドロップしてください。")});
document.addEventListener("paste",e=>{const items=Array.from(e.clipboardData?.items||[]),item=items.find(i=>i.type.startsWith("image/"));if(item){const f=item.getAsFile();if(f)loadImage(f)}});
$("camera").addEventListener("click",async()=>{
 if(!navigator.mediaDevices?.getUserMedia){status("カメラにはHTTPSまたはlocalhostが必要です。");return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});video.srcObject=stream;video.hidden=false;await video.play();scanning=true;$("camera").disabled=true;$("stop").disabled=false;status("QRコードをカメラに映してください。");scanLoop()}
 catch(e){status("カメラ起動失敗: "+e.message);stopCamera()}
});
function scanLoop(){
 if(!scanning||busy)return;busy=true;
 try{if(video.readyState>=2&&performance.now()-lastScan>180){lastScan=performance.now();const code=decodeImage(video);if(code&&code.data!==lastScanned){lastScanned=code.data;processQR(code);stopCamera();busy=false;return}}}
 catch(e){status("スキャンエラー: "+e.message)}
 busy=false;if(scanning)requestAnimationFrame(scanLoop)
}
function stopCamera(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;video.hidden=true;$("camera").disabled=false;$("stop").disabled=true}
$("stop").addEventListener("click",stopCamera);
$("viewHex").addEventListener("click",()=>{mode="hex";renderBinary()});$("viewText").addEventListener("click",()=>{mode="text";renderBinary()});
$("applyHex").addEventListener("click",()=>{
 const input=$("hexInput").value.trim();if(!input){status("HEXデータを入力してください。");return}
 const tokens=input.split(/[\s,]+/);if(tokens.some(t=>! /^(?:0x)?[0-9a-fA-F]{2}$/.test(t))){status("2桁の16進数をスペース区切りで入力してください。");return}
 const data=Uint8Array.from(tokens,t=>parseInt(t.replace(/^0x/i,""),16));let text;
 try{text=new TextDecoder("utf-8",{fatal:true}).decode(data)}catch{text="(UTF-8テキストとして解釈できません)"}
 setBytes(data,text,"手動入力HEX");status=data.length+" bytes を解析しました。"
});
$("applyText").addEventListener("click",()=>{const text=$("textInput").value;setBytes(new TextEncoder().encode(text),text,classify(text));status(textEncoderLength(text)+" bytes のテキストを解析しました。")});
function textEncoderLength(s){return new TextEncoder().encode(s).length}
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(resultText);status("テキストをコピーしました。")}catch{status("コピーできません。テキストを手動で選択してください。")}});
$("download").addEventListener("click",()=>{const url=URL.createObjectURL(new Blob([bytes],{type:"application/octet-stream"})),a=document.createElement("a");a.href=url;a.download="qr_payload.bin";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$("clear").addEventListener("click",()=>{stopCamera();bytes=new Uint8Array();resultText="";lastScanned="";$("result").textContent="未解析";$("meta").textContent="データ：なし";$("tags").replaceChildren();$("binary").textContent="";$("hexInput").value="";$("textInput").value="";$("file").value="";preview.removeAttribute("src");preview.style.display="none";status("クリアしました。")});
window.addEventListener("pagehide",stopCamera);
</script>
</body>
</html>
